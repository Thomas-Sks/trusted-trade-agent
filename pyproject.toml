[project]
name = "ttap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.163",
  "uvicorn>=0.54",
  "pydantic>=2.14",
  "httpx>=0.28",
  "cedarpy>=4.12.2",
  "joserfc>=1.8",
  "rfc8785>=0.1.4",
  "pycountry>=24.6",
]

[dependency-groups]
dev = ["pytest>=9.2", "pytest-asyncio>=1.5", "respx>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ttap"]
